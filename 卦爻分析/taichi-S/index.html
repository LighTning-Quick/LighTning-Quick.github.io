<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>太极 S：一笔拉伸</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="stage">
      <canvas id="scene" aria-label="太极一笔画从二维平面只沿高度拉伸"></canvas>
      <div id="labels" class="labels" aria-live="polite"></div>

      <section class="hud" aria-label="控制面板">
        <div class="brand">
          <span class="seal">S</span>
          <div>
            <h1>太极 S</h1>
            <p>标准半圆 · 整体平移 · 对称反升</p>
          </div>
        </div>

        <div class="controls">
          <div class="annotator">
            <label>
              <span>卦名</span>
              <input id="hexagram" type="text" value="大有" autocomplete="off" />
            </label>
            <button id="annotate" type="button">标注图式</button>
            <p id="annotationStatus" class="status"></p>
          </div>
          <label>
            <span>提升</span>
            <input id="lift" type="range" min="0" max="1" step="0.001" value="0" />
          </label>
          <label>
            <span>平滑</span>
            <input id="twist" type="range" min="0" max="1" step="0.001" value="1" />
          </label>
          <label>
            <span>速度</span>
            <input id="speed" type="range" min="0" max="1" step="0.001" value="0.42" />
          </label>
        </div>

        <div class="actions">
          <button id="toggle" type="button" aria-pressed="true">暂停</button>
          <button id="idiomMode" type="button" aria-pressed="false">四字成语</button>
          <button id="mirror" type="button" aria-pressed="false">对称曲线</button>
          <button id="reset" type="button">归位</button>
        </div>
      </section>
    </main>

    <script src="./hexagram-data.js"></script>
    <script src="./main.js" defer></script>
  </body>
</html>
