site_name: 易经诠释
site_description: 《周易》卦爻辞翻译与诠释
site_author: 霆钧

docs_dir: 英语翻译
site_dir: ../site

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang: zh

nav:
  - 目录: index.md
  - 说明: ABOUT.md
  - 上经:
    - 乾卦: 1-乾卦翻译.md
    - 坤卦: 2-坤卦翻译.md
    - 师卦: 7-师卦翻译.md
    - 比卦: 8-比卦翻译.md
    - 同人卦: 13-同人卦翻译.md
    - 大有卦: 14-大有卦翻译.md
    - 临卦: 19-临卦翻译.md
    - 观卦: 20-观卦翻译.md
    - 剥卦: 23-剥卦翻译.md
    - 复卦: 24-复卦翻译.md
    - 习坎卦: 29-习坎卦翻译.md
  - 下经:
    - 夬卦: 43-夬卦翻译.md
    - 姤卦: 44-姤卦翻译.md
    - 困卦: 47-困卦翻译.md
    - 井卦: 48-井卦翻译.md
    - 丰卦: 55-丰卦翻译.md
    - 旅卦: 56-旅卦翻译.md
    - 巽卦: 57-巽卦翻译.md
    - 兑卦: 58-兑卦翻译.md
    - 涣卦: 59-涣卦翻译.md
    - 节卦: 60-节卦翻译.md
    - 中孚卦: 61-中孚卦翻译.md
    - 小过卦: 62-小过卦翻译.md
    - 既济卦: 63-既济卦翻译.md
    - 未济卦: 64-未济卦翻译.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.tasklist
  - footnotes